[package]
name = "bulletproofs_ipa"
version = "0.1.0"
edition = "2024"

[dependencies]
rayon = "1"
ark-ff = { version = "0.5.0", features = ["parallel"] }
ark-ec = { version = "0.5.0", features = ["parallel"] }
ark-std = { version = "0.5.0", features = ["parallel"] }
ark-bls12-381 = "0.5.0"
ark-serialize = "0.5.0"
merlin = "3.0.0"
ark-relations = "0.5.0"
ark-crypto-primitives = { version = "0.5", features = [
    "crh",
    "r1cs",
    "sponge",
] }
ark-r1cs-std = "0.5"
sha2 = "0.10"

[workspace]
